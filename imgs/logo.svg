<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Psychic Tournament">
  <defs>
    <linearGradient id="pt-tile" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D1F8B"/>
      <stop offset=".5" stop-color="#1A1446"/>
      <stop offset="1" stop-color="#0B0A16"/>
    </linearGradient>
    <linearGradient id="pt-edge" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <radialGradient id="pt-core" cx="32" cy="32" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#7DE9FF"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- card back tile -->
  <rect x="6" y="4" width="52" height="56" rx="13" fill="url(#pt-tile)"/>
  <rect x="6.9" y="4.9" width="50.2" height="54.2" rx="12.1" stroke="url(#pt-edge)" stroke-width="1.8"/>

  <!-- concentric rings, as on the Zener card back -->
  <g stroke="#00D4FF" fill="none" stroke-linecap="round">
    <circle cx="32" cy="32" r="19" stroke-opacity=".22" stroke-width="1.1"/>
    <circle cx="32" cy="32" r="13.5" stroke-opacity=".38" stroke-width="1.1"/>
    <circle cx="32" cy="32" r="8" stroke-opacity=".6" stroke-width="1.2"/>
  </g>

  <!-- radiating spokes -->
  <g stroke="#A5B4FC" stroke-opacity=".5" stroke-width="1.2" stroke-linecap="round">
    <path d="M32 9v4.5M32 50.5V55M9 32h4.5M50.5 32H55"/>
  </g>

  <!-- bright signal core -->
  <circle cx="32" cy="32" r="12" fill="url(#pt-core)"/>
  <circle cx="32" cy="32" r="3.1" fill="#FFFFFF"/>
</svg>
